<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Gallery</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/Dublin-logo.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/gallery.css">
    <script src="assets/js/gallery.js" type="module"></script>

</head>
<body>
    <header>
        <a href="index.html" class="logo-link">
            <img src="assets/images/Dublin-logo.png" alt="Dublin Logo" class="logo">
        </a>
        <nav>
            <ul>
                <li class="nav-home"><a href="index.html">Home</a></li>
                <li class="nav-blog"><a href="index.html#blog">Blog</a></li>
                <li class="nav-gallery"><a>Gallery</a></li>
            </ul>
        </nav>
    </header>
<main>
    <div class="gallery">
        <div class="gallery-header">
            <h1>GALLERY</h1>
            <p class="gallery-subtext">A collection of memories from our school trip to Dublin — captured across 4 days of exploring the city, its culture, and everything in between.</p>
        </div>
        <!-- Gallery sections are injected by gallery.js -->
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close">&times;</button>
        <button class="lightbox-prev" id="lightbox-prev">&#8249;</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <button class="lightbox-next" id="lightbox-next">&#8250;</button>
    </div>
</main>
</body>
</html>
